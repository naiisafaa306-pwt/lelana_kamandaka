<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Lelana Kamandaka — Intro cerita perjalanan Raden Kamandaka."
    >

    <title>Lelana Kamandaka — Intro 2</title>


    <!-- =========================================================
         GOOGLE FONTS
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         GLOBAL CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/base.css"
    >


    <!-- =========================================================
         GLOBAL NAVBAR + SIDEBAR CSS

         navbar.css berada di ROOT PROJECT.

         intro2.html berada di folder intro.

         Jadi path:
         ../navbar.css
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../navbar.css"
    >


    <!-- =========================================================
         OPENING / LAYOUT CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../css/screens/opening.css"
    >


    <!-- =========================================================
         BUTTON CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../css/components/buttons.css"
    >


    <!-- =========================================================
         STORY / INTRO CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../css/screens/story.css"
    >

</head>


<body>


    <!-- =========================================================
         GLOBAL NAVBAR + SIDEBAR

         JANGAN membuat navbar/sidebar lagi di halaman ini.

         navbar.js akan mengambil:

         /navbar.html

         kemudian memasukkannya ke:

         #globalNavbar
         ========================================================= -->

    <div id="globalNavbar"></div>



    <!-- =========================================================
         HALAMAN INTRO 2
         ========================================================= -->

    <div class="lk-page">


        <!-- =====================================================
             BATIK BACKGROUND
             ===================================================== -->

        <div
            class="lk-batik-pattern"
            aria-hidden="true"
        >

            <img
                src="../assets/decorations/batik_pattern.png"
                alt=""
            >

        </div>



        <!-- =====================================================
             MAIN
             ===================================================== -->

        <div class="lk-main">


            <!-- =================================================
                 CONTENT INTRO 02
                 ================================================= -->

            <main class="lk-content intro-main">


                <!-- =================================================
                     STORY SCREEN
                     ================================================= -->

                <section
                    id="screen-story"
                    class="screen-view active"
                >


                    <!-- =================================================
                         PANEL TEKS
                         ================================================= -->

                    <div class="story-text-panel">


                        <!-- =================================================
                             ORNAMEN
                             ================================================= -->

                        <div class="story-ornament">


                            <!-- DAUN KIRI -->

                            <img
                                src="../assets/icons/leaf_01.svg"
                                class="story-leaf-icon"
                                alt=""
                                aria-hidden="true"
                            >


                            <!-- GARIS KIRI -->

                            <span
                                class="story-ornament-line"
                            ></span>


                            <!-- TITIK TENGAH -->

                            <span
                                class="story-ornament-dot"
                            ></span>


                            <!-- GARIS KANAN -->

                            <span
                                class="story-ornament-line"
                            ></span>


                            <!-- DAUN KANAN -->

                            <img
                                src="../assets/icons/leaf_02.svg"
                                class="story-leaf-icon"
                                alt=""
                                aria-hidden="true"
                            >


                        </div>



                        <!-- =================================================
                             LABEL
                             ================================================= -->

                        <span class="story-eyebrow">
                            LELANA KAMANDAKA
                        </span>



                        <!-- =================================================
                             JUDUL
                             ================================================= -->

                        <h1 class="story-title">

                            Sebuah perjalanan

                            <em>
                                dimulai.
                            </em>

                        </h1>



                        <!-- =================================================
                             CERITA
                             ================================================= -->

                        <p
                            id="story-text-body"
                            class="story-body-text"
                        >

                            Di antara kehidupan istana,
                            hiduplah Raden Kamandaka,
                            seorang pemuda yang memilih
                            membawa takdirnya menuju
                            sebuah perjalanan panjang...

                        </p>



                        <!-- =================================================
                             NOMOR HALAMAN
                             ================================================= -->

                        <div class="story-page-indicator">


                            <!-- NOMOR AKTIF -->

                            <span class="story-page-number">
                                02
                            </span>


                            <!-- GARIS -->

                            <span class="story-page-line">
                            </span>


                            <!-- TOTAL -->

                            <span class="story-page-total">
                                04
                            </span>


                        </div>



                        <!-- =================================================
                             BUTTON
                             ================================================= -->

                        <div class="story-panel-footer">


                            <!-- =================================================
                                 KEMBALI
                                 ================================================= -->

                            <a
                                href="intro.html"
                                class="story-back-btn"
                            >

                                <strong>
                                    ←
                                </strong>

                                <span>
                                    KEMBALI
                                </span>

                            </a>



                            <!-- =================================================
                                 LANJUT
                                 ================================================= -->

                            <a
                                href="intro3.html"
                                class="story-lanjut-btn"
                            >

                                <span>
                                    LANJUT
                                </span>

                                <strong>
                                    →
                                </strong>

                            </a>


                        </div>


                    </div>



                    <!-- =================================================
                         PANEL GAMBAR
                         ================================================= -->

                    <div
                        class="story-illustration-panel"
                    >


                        <!-- =================================================
                             GAMBAR
                             ================================================= -->

                        <img
                            id="story-illustration-img"
                            src="../assets/images/screen 3.png"
                            class="story-illustration-img"
                            alt="Raden Kamandaka"
                        >


                        <!-- =================================================
                             OVERLAY
                             ================================================= -->

                        <div
                            class="story-image-overlay"
                            aria-hidden="true"
                        ></div>


                        <!-- =================================================
                             CAPTION
                             ================================================= -->

                        <div
                            class="story-image-caption"
                        >

                            <span>
                                BAB I
                            </span>

                            <strong>
                                RADEN KAMANDAKA
                            </strong>

                        </div>


                    </div>


                </section>


            </main>


        </div>


    </div>



    <!-- =========================================================
         GLOBAL NAVBAR JAVASCRIPT

         navbar.js berada di:

         /js/navbar.js

         intro2.html berada di:

         /intro/intro2.html

         Jadi:
         ../js/navbar.js
         ========================================================= -->

    <script
        src="../js/navbar.js"
    ></script>


</body>

</html>
