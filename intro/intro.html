<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Lelana Kamandaka — Intro perjalanan Raden Kamandaka."
    >

    <title>Lelana Kamandaka — Intro Cerita</title>


    <!-- =========================================================
         FONT
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         GLOBAL CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/base.css"
    >


    <!-- =========================================================
         GLOBAL NAVBAR + SIDEBAR CSS

         navbar.css berada di ROOT PROJECT.

         intro.html berada di:

         /intro/intro.html

         Jadi path yang benar:

         ../navbar.css
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../navbar.css"
    >


    <!-- =========================================================
         OPENING / STORY CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../css/screens/opening.css"
    >

    <link
        rel="stylesheet"
        href="../css/components/buttons.css"
    >


    <!-- =========================================================
         INTRO CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../intro/intro.css"
    >


    <!-- =========================================================
         STORY CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../css/screens/story.css"
    >

</head>


<body>


    <!-- =========================================================
         GLOBAL NAVBAR + SIDEBAR

         JANGAN TULIS NAVBAR / SIDEBAR LAGI DI SINI.

         navbar.js akan mengambil:

         /navbar.html

         lalu memasukkannya ke:

         #globalNavbar

         Jadi navbar yang tampil adalah NAVBAR GLOBAL.
         ========================================================= -->

    <div id="globalNavbar"></div>



    <!-- =========================================================
         INTRO PAGE
         ========================================================= -->

    <div class="lk-page">


        <!-- =====================================================
             BATIK BACKGROUND
             ===================================================== -->

        <div
            class="lk-batik-pattern"
            aria-hidden="true"
        >

            <img
                src="../assets/decorations/batik_pattern.png"
                alt=""
            >

        </div>



        <!-- =====================================================
             MAIN CONTENT
             ===================================================== -->

        <div class="lk-main">


            <!-- =================================================
                 INTRO CONTENT
                 ================================================= -->

            <main class="lk-content intro-main">


                <!-- =================================================
                     STORY SCREEN
                     ================================================= -->

                <section
                    id="screen-story"
                    class="screen-view active"
                >


                    <!-- =================================================
                         PANEL TEKS
                         ================================================= -->

                    <div class="story-text-panel">


                        <!-- =================================================
                             ORNAMEN ATAS
                             ================================================= -->

                        <div class="story-ornament">


                            <!-- DAUN KIRI -->

                            <img
                                src="../assets/icons/leaf_01.svg"
                                class="story-leaf-icon"
                                alt=""
                                aria-hidden="true"
                            >


                            <!-- GARIS KIRI -->

                            <span
                                class="story-ornament-line"
                            ></span>


                            <!-- TITIK TENGAH -->

                            <span
                                class="story-ornament-dot"
                            ></span>


                            <!-- GARIS KANAN -->

                            <span
                                class="story-ornament-line"
                            ></span>


                            <!-- DAUN KANAN -->

                            <img
                                src="../assets/icons/leaf_02.svg"
                                class="story-leaf-icon"
                                alt=""
                                aria-hidden="true"
                            >


                        </div>



                        <!-- =================================================
                             LABEL
                             ================================================= -->

                        <span class="story-eyebrow">
                            LELANA KAMANDAKA
                        </span>



                        <!-- =================================================
                             JUDUL
                             ================================================= -->

                        <h1 class="story-title">

                            Jejak yang

                            <em>
                                bermula.
                            </em>

                        </h1>



                        <!-- =================================================
                             DESKRIPSI CERITA
                             ================================================= -->

                        <p
                            id="story-text-body"
                            class="story-body-text"
                        >
                            Di jantung Kerajaan Pajajaran
                            yang megah, sebuah kisah
                            kepahlawanan bermula...
                        </p>



                        <!-- =================================================
                             NOMOR HALAMAN
                             ================================================= -->

                        <div class="story-page-indicator">


                            <!-- NOMOR AKTIF -->

                            <span class="story-page-number">
                                01
                            </span>


                            <!-- GARIS -->

                            <span class="story-page-line">
                            </span>


                            <!-- TOTAL -->

                            <span class="story-page-total">
                                04
                            </span>


                        </div>



                        <!-- =================================================
                             BUTTON FOOTER
                             ================================================= -->

                        <div class="story-panel-footer">


                            <!-- =================================================
                                 KEMBALI
                                 ================================================= -->

                            <a
                                href="../index.html"
                                class="story-back-btn"
                            >

                                <span>
                                    ←
                                </span>

                                <span>
                                    KEMBALI
                                </span>

                            </a>



                            <!-- =================================================
                                 LANJUT
                                 ================================================= -->

                            <a
                                href="intro2.html"
                                class="story-lanjut-btn"
                            >

                                <span>
                                    LANJUT
                                </span>

                                <strong>
                                    →
                                </strong>

                            </a>


                        </div>


                    </div>



                    <!-- =================================================
                         PANEL ILUSTRASI
                         ================================================= -->

                    <div
                        class="story-illustration-panel"
                    >


                        <!-- =================================================
                             GAMBAR PAJAJARAN
                             ================================================= -->

                        <img
                            id="story-illustration-img"
                            src="../assets/images/screen 2.png"
                            class="story-illustration-img"
                            alt="Kerajaan Pajajaran"
                        >


                        <!-- =================================================
                             OVERLAY GAMBAR
                             ================================================= -->

                        <div
                            class="story-image-overlay"
                            aria-hidden="true"
                        ></div>


                        <!-- =================================================
                             CAPTION GAMBAR
                             ================================================= -->

                        <div
                            class="story-image-caption"
                        >

                            <span>
                                BAB I
                            </span>

                            <strong>
                                PAJAJARAN
                            </strong>

                        </div>


                    </div>


                </section>


            </main>


        </div>


    </div>



    <!-- =========================================================
         GLOBAL NAVBAR JAVASCRIPT

         navbar.js berada di:

         /js/navbar.js

         intro.html berada di:

         /intro/intro.html

         Maka:

         ../js/navbar.js
         ========================================================= -->

    <script
        src="../js/navbar.js"
    ></script>


</body>

</html>
