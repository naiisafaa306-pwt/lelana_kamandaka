<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Peta perjalanan Lelana Kamandaka — jelajahi jejak perjalanan Raden Kamandaka."
    >

    <title>Lelana Kamandaka — Peta Perjalanan</title>


    <!-- =========================================================
         GOOGLE FONTS
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         GLOBAL CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/base.css"
    >

    <!-- GLOBAL NAVBAR + SIDEBAR -->

    <link
        rel="stylesheet"
        href="css/components/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/components/buttons.css"
    >


    <!-- =========================================================
         MAP CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="css/screens/map.css"
    >


</head>


<body>


    <!-- =========================================================
         GLOBAL NAVBAR

         SATU-SATUNYA tempat navbar global dimuat.

         Jangan membuat:
         <aside class="lk-sidebar">
         <header class="lk-navbar">

         di file ini.
         ========================================================= -->

    <div id="globalNavbar"></div>


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <div class="lk-main">


        <!-- =====================================================
             CONTENT
             ===================================================== -->

        <main class="lk-content">


            <!-- =================================================
                 BACKGROUND PATTERN
                 ================================================= -->

            <div
                class="map-page-pattern"
                aria-hidden="true"
            ></div>


            <!-- =================================================
                 MAP HEADER
                 ================================================= -->

            <section class="map-header">


                <span class="map-eyebrow">
                    LELANA KAMANDAKA
                </span>


                <h1>
                    Peta Perjalanan
                </h1>


                <p>
                    Telusuri jejak perjalanan Raden Kamandaka
                    dari satu tempat ke tempat berikutnya.
                </p>


                <div class="map-header-ornament">

                    <span></span>

                    <b>
                        ◆
                    </b>

                    <span></span>

                </div>


            </section>


            <!-- =================================================
                 MAP SECTION
                 ================================================= -->

            <section class="map-section">


                <div class="map-card">


                    <div
                        class="map-canvas"
                        id="mapCanvas"
                    >


                        <!-- =====================================
                             PETA DASAR
                             ===================================== -->

                        <img
                            src="assets/map/peta_lelana.png"
                            class="map-background"
                            alt="Peta perjalanan Lelana Kamandaka"
                        >


                        <!-- =====================================
                             JALUR
                             ===================================== -->

                        <img
                            src="assets/images/route-1-2.svg"
                            class="map-route"
                            id="route-1-2"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            src="assets/images/route-2-3.svg"
                            class="map-route"
                            id="route-2-3"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            src="assets/images/route-3-4.svg"
                            class="map-route"
                            id="route-3-4"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            src="assets/images/route-4-5.svg"
                            class="map-route"
                            id="route-4-5"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            src="assets/images/route-5-6.svg"
                            class="map-route"
                            id="route-5-6"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            src="assets/images/route-6-7.svg"
                            class="map-route"
                            id="route-6-7"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            src="assets/images/route-7-8.svg"
                            class="map-route"
                            id="route-7-8"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            src="assets/images/route-8-9.svg"
                            class="map-route"
                            id="route-8-9"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            src="assets/images/route-9-10.svg"
                            class="map-route"
                            id="route-9-10"
                            alt=""
                            aria-hidden="true"
                        >


                        <!-- =====================================
                             LOKASI 01
                             ===================================== -->

                        <a
                            href="gameplay/gameplay01/index.html"
                            class="map-location location-01 unlocked"
                            data-location="1"
                            aria-label="Pajajaran — Lokasi terbuka"
                        >

                            <img
                                src="assets/map/location.png"
                                alt=""
                            >

                            <span class="location-label">
                                Pajajaran
                            </span>

                        </a>


                        <!-- =====================================
                             LOKASI 02
                             ===================================== -->

                        <button
                            class="map-location location-02 locked"
                            data-location="2"
                            type="button"
                            aria-label="Ki Ajar Winarong — Terkunci"
                        >

                            <img
                                src="assets/map/gembok.png"
                                alt=""
                            >

                            <span class="location-label">
                                Ki Ajar Winarong
                            </span>

                        </button>


                        <!-- =====================================
                             LOKASI 03
                             ===================================== -->

                        <button
                            class="map-location location-03 locked"
                            data-location="3"
                            type="button"
                            aria-label="Pasir Luhur — Terkunci"
                        >

                            <img
                                src="assets/map/gembok.png"
                                alt=""
                            >

                            <span class="location-label">
                                Pasir Luhur
                            </span>

                        </button>


                        <!-- =====================================
                             LOKASI 04
                             ===================================== -->

                        <button
                            class="map-location location-04 locked"
                            data-location="4"
                            type="button"

                                alt=""

                        </button>


                        <!-- =====================================
                             LOKASI 05
                             ===================================== -->

                        <button
                            class="map-location location-05 locked"
                            data-location="5"
                            type="button"
                            aria-label="Desa Panagih — Terkunci"
                        >

                            <img
                                src="assets/map/gembok.png"
                                alt=""
                            >

                            <span class="location-label">
                                Desa Panagih
                            </span>

                        </button>


                        <!-- =====================================
                             LOKASI 06
                             ===================================== -->

                        <button
                            class="map-location location-06 locked"
                            data-location="6"
                            type="button"
                            aria-label="Goa Jatijajar — Terkunci"
                        >

                            <img
                                src="assets/map/gembok.png"
                                alt=""
                            >

                            <span class="location-label">
                                Goa Jatijajar
                            </span>

                        </button>


                        <!-- =====================================
                             LOKASI 07
                             ===================================== -->

                        <button
                            class="map-location location-07 locked"
                            data-location="7"
                            type="button"
                            aria-label="Batur Agung — Terkunci"
                        >

                            <img
                                src="assets/map/gembok.png"
                                alt=""
                            >

                            <span class="location-label">
                                Batur Agung
                            </span>

                        </button>


                        <!-- =====================================
                             LOKASI 08
                             ===================================== -->

                        <button
                            class="map-location location-08 locked"
                            data-location="8"
                            type="button"
                            aria-label="Sawangan — Terkunci"
                        >

                            <img
                                src="assets/map/gembok.png"
                                alt=""
                            >

                            <span class="location-label">
                                Sawangan
                            </span>

                        </button>


                        <!-- =====================================
                             LOKASI 09
                             ===================================== -->

                        <button
                            class="map-location location-09 locked"
                            data-location="9"
                            type="button"
                            aria-label="Kali Serayu — Terkunci"
                        >

                            <img
                                src="assets/map/gembok.png"
                                alt=""
                            >

                            <span class="location-label">
                                Kali Serayu
                            </span>

                        </button>


                        <!-- =====================================
                             LOKASI 10
                             ===================================== -->

                        <button
                            class="map-location location-10 locked"
                            data-location="10"
                            type="button"
                            aria-label="Desa Rosari — Terkunci"
                        >

                            <img
                                src="assets/map/gembok.png"
                                alt=""
                            >

                            <span class="location-label">
                                Desa Rosari
                            </span>

                        </button>


                    </div>

                </div>


            </section>


            <!-- =================================================
                 LEGEND
                 ================================================= -->

            <section class="map-legend">


                <div class="map-legend-item">

                    <img
                        src="assets/map/location.png"
                        alt=""
                    >

                    <span>
                        Lokasi terbuka
                    </span>

                </div>


                <div class="map-legend-item">

                    <img
                        src="assets/map/gembok.png"
                        alt=""
                    >

                    <span>
                        Lokasi terkunci
                    </span>

                </div>


                <div class="map-legend-item">

                    <span class="map-legend-route"></span>

                    <span>
                        Jalur perjalanan
                    </span>

                </div>


            </section>


        </main>


    </div>


    <!-- =========================================================
         GLOBAL NAVBAR LOADER
         ========================================================= -->

    <script src="js/navbar.js"></script>


    <!-- =========================================================
         MAP ENGINE
         ========================================================= -->

    <script src="js/components/mapEngine.js"></script>


</body>

</html>
